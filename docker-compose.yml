version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: flood_postgis
    environment:
      POSTGRES_DB: urban_flood_db
      POSTGRES_USER: flood_user
      POSTGRES_PASSWORD: flood_secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infrastructure/postgis-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood_user -d urban_flood_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flood_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backend
    container_name: flood_backend
    environment:
      - DATABASE_URL=postgresql://flood_user:flood_secure_password_change_me@postgis:5432/urban_flood_db
      - REDIS_URL=redis://redis:6379/0
      - OPEN_METEO_FORECAST_URL=https://api.open-meteo.com/v1/forecast
      - OPEN_METEO_ELEVATION_URL=https://api.open-meteo.com/v1/elevation
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: flood_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgis_data:
  redis_data:
